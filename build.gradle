plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
}

repositories {
	// Loom 会自动添加 Minecraft、Fabric 与 Maven Central 三个仓库，
	// 所以这里只声明它不会加的那个：Sodium 只发布在 CaffeineMC 自己的仓库里。
	maven {
		name = "CaffeineMC"
		url = "https://maven.caffeinemc.net/releases"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"caldera" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// 版本号见 gradle.properties
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// 0.5.1 硬依赖 Sodium：mixin/sodium/** 会在编译期引用它的内部类。
	// 用 implementation 而非 modImplementation —— Sodium 与 Minecraft 同为 official 命名空间，
	// 无需 remap；这一点已在开发环境的 runClient 里实测通过。
	implementation "net.caffeinemc:sodium-fabric:${project.sodium_version}"

	// MixinExtras 由 Fabric Loader 以嵌套 jar 形式在运行期提供（0.5.5），
	// 所以只需进编译期 classpath，不打包。
	compileOnly "io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"
}

processResources {
	// 必须先把 project.version 取到局部变量再用于 expand。
	// 直接写 inputs.properties.version 会在 configuration cache 下失败：
	// copy-spec 的闭包里拿不到 inputs，报 "> inputs"。
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// 产物名带 Minecraft 版本后缀，例如 caldera-0.5.1-26.3.jar。
// 用 AbstractArchiveTask 一次覆盖 jar、sourcesJar 等全部归档任务。
tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
	archiveVersion = "${project.version}-${project.minecraft_version}"
}
