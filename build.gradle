plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
}

repositories {
	// Loom 会自动添加 Minecraft、Fabric 与 Maven Central 三个仓库，
	// 所以这里只声明它不会加的那个：Sodium 只发布在 CaffeineMC 自己的仓库里。
	maven {
		name = "CaffeineMC"
		url = "https://maven.caffeinemc.net/releases"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"caldera" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// 版本号见 gradle.properties
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// 0.5.1 硬依赖 Sodium：mixin/sodium/** 会在编译期引用它的内部类。
	// 用 implementation 而非 modImplementation —— Sodium 与 Minecraft 同为 official 命名空间，
	// 无需 remap；这一点已在开发环境的 runClient 里实测通过。
	implementation "net.caffeinemc:sodium-fabric:${project.sodium_version}"

	// MixinExtras 由 Fabric Loader 以嵌套 jar 形式在运行期提供（0.5.5），
	// 所以只需进编译期 classpath，不打包。
	compileOnly "io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"
}

processResources {
	// 必须先把 project.version 取到局部变量再用于 expand。
	// 直接写 inputs.properties.version 会在 configuration cache 下失败：
	// copy-spec 的闭包里拿不到 inputs，报 "> inputs"。
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	// 把许可证文本打进产物。LGPL-3.0 是 GPL-3.0 的附加许可，其第 4 条要求
	// 随作品一并分发 GPL 与 LGPL 两份文本，所以 LICENSE 和 COPYING 都要进去。
	// 文件名加模组名后缀，避免与其他模组的许可证文件在多模组环境里冲突。
	def projectName = project.name
	inputs.property "projectName", projectName

	// 必须用 files(...) 包成"单个"参数。
	// 写成 from("LICENSE", "COPYING") { } 会因为参数个数为 3 而匹配不上
	// from(Object, Closure) 这个重载，退化成 from(Object...)，尾随闭包会被
	// 当成一个待求值的"路径"来源，最终导致 :jar 依赖它自己（循环依赖）。
	from(files("LICENSE", "COPYING")) {
		rename { "${it}_$projectName" }
	}
}
