plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
	id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "caldera"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"caldera" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Sodium 只在 CaffeineMC 自己的仓库里发布；MixinExtras 在 Maven Central。
repositories {
	maven {
		name = "CaffeineMC"
		url = "https://maven.caffeinemc.net/releases"
	}
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// 0.5.1 硬依赖 Sodium：mixin/sodium/** 会在编译期引用它的内部类。
	// 用 implementation 而非 modImplementation —— Sodium 与 Minecraft 同为 official 命名空间，
	// 无需 remap；这一点已在开发环境的 runClient 里实测通过。
	implementation "net.caffeinemc:sodium-fabric:${project.sodium_version}"

	// MixinExtras 由 Fabric Loader 以嵌套 jar 形式在运行期提供（0.5.5），
	// 所以只需进编译期 classpath，不打包。
	compileOnly "io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
}

tasks.named("jar", Jar).configure {
	archiveVersion = "${project.mod_version}-${project.minecraft_version}"
}

tasks.matching { it.name == "remapJar" }.configureEach {
	archiveVersion = "${project.mod_version}-${project.minecraft_version}"
}

tasks.named("sourcesJar", Jar).configure {
	archiveVersion = "${project.mod_version}-${project.minecraft_version}"
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
