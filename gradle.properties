# 提高 Gradle 可用内存。
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric 属性
# 版本可在 https://fabricmc.net/develop 查询
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18.2

# 模组属性
# version 与 group 用 Gradle 的标准属性名，Gradle 会直接读作 project.version / project.group，
# 因此 build.gradle 里不需要再写 version = ... / group = ...
version=0.5.1
group=com.caldera

# 依赖
fabric_api_version=0.161.0+26.3
sodium_version=0.9.2+mc26.3
mixinextras_version=0.5.5
